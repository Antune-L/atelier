[Service]
# Autonomous campaigns (docs/vps-install.md, "Autonomous campaigns"). Tune the memory values from measured session footprints; /etc/kanban/kanban.env overrides them.
Environment=KANBAN_AUTONOMOUS_PILOT=1
Environment=KANBAN_MAX_IMPLEMENTERS=8
Environment=KANBAN_IMPLEMENTER_MEMORY_MB=1536
Environment=KANBAN_MEMORY_RESERVE_MB=1024
Environment=KANBAN_MIN_FREE_DISK_MB=4096
